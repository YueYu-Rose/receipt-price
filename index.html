<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小票比价 · Receipt Price</title>
<meta name="description" content="Snap your grocery receipts, let AI read them, and find which store sells each item for less.">
<meta name="theme-color" content="#0E6B5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小票比价">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-t="appName"></h1>
      <p class="sub" id="stats"></p>
    </div>
    <div class="top-btns">
      <button id="langBtn" class="icon-btn" aria-label="Language"></button>
      <button id="openSettings" class="icon-btn" data-t="settings"></button>
    </div>
  </header>

  <section class="card setup" id="setup" hidden>
    <h2 data-t="setupTitle"></h2>
    <p class="hint-strong" data-t="setupIntro"></p>
    <ul class="opts" id="setupOpts"></ul>
    <p class="hint-strong" data-t="setupThen"></p>
    <p class="hint" data-t="keyLocal"></p>
  </section>

  <section class="notice-bar" id="homeTip" hidden>
    <p data-t="homeTip"></p>
    <button id="homeTipClose" data-t="gotIt"></button>
  </section>

  <section class="notice-bar" id="backupTip" hidden>
    <p id="backupTipText"></p>
    <button id="backupTipBtn" class="solid" data-t="exportBackup"></button>
  </section>

  <section class="card scan">
    <div class="scan-actions">
      <label class="btn primary" id="camBtn"><span data-t="takePhoto"></span><input id="camInput" type="file" accept="image/*" capture="environment"></label>
      <label class="btn" id="galBtn"><span data-t="choosePhotos"></span><input id="galInput" type="file" accept="image/*" multiple></label>
    </div>
    <p class="hint" data-t="scanHint"></p>
    <ul class="queue" id="queue"></ul>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabCompare" aria-selected="true" data-t="tabCompare"></button>
    <button role="tab" id="tabReceipts" aria-selected="false" data-t="tabReceipts"></button>
  </div>

  <section id="viewCompare">
    <div class="controls">
      <input type="search" id="search">
      <div class="seg" role="group">
        <button id="modeExact" aria-pressed="true" data-t="modeExact"></button>
        <button id="modeCat" aria-pressed="false" data-t="modeCat"></button>
      </div>
      <label class="chk"><input type="checkbox" id="multiOnly"><span data-t="multiOnly"></span></label>
    </div>
    <div class="list" id="compareList"></div>
    <p class="hint" data-t="compareHint"></p>
  </section>

  <section id="viewReceipts" hidden>
    <div id="receiptList" class="stack"></div>
    <div class="backup">
      <button id="exportBtn" data-t="exportBackup"></button>
      <label class="btn small"><span data-t="importBackup"></span><input id="importInput" type="file" accept="application/json,.json"></label>
    </div>
    <p class="hint" data-t="backupHint"></p>
  </section>

  <footer class="foot">
    <a href="https://github.com/YueYu-Rose/receipt-price" target="_blank" rel="noopener" data-t="sourceLink"></a>
  </footer>
</div>

<dialog id="settings">
  <form method="dialog" class="settings-form">
    <h2 data-t="settings"></h2>
    <label for="provider" data-t="providerLabel"></label>
    <select id="provider"></select>
    <p class="hint" id="providerNote"></p>
    <label for="apiKey" data-t="apiKeyLabel"></label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
    <p class="hint" id="keyHint"></p>
    <div id="baseWrap">
      <label for="baseUrl" data-t="baseLabel"></label>
      <input id="baseUrl" type="url" spellcheck="false" autocapitalize="off" placeholder="https://…/v1">
    </div>
    <label for="model" data-t="modelLabel"></label>
    <input id="model" type="text" spellcheck="false" autocapitalize="off">
    <p class="hint" data-t="modelHint"></p>
    <p class="notice" data-t="privacyNote"></p>
    <div class="row-btns">
      <button value="cancel" formnovalidate data-t="cancel"></button>
      <button value="save" class="primary-btn" data-t="save"></button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
